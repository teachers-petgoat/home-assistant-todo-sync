[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-todo-sync"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-homeassistant-custom-component==0.13.367",
]
dev = [
  "home-assistant-todo-sync[test]",
  "ruff>=0.9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "COM812", "CPY001", "D203", "D213", "TC002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["FBT001", "S101"]
"tests/test_sync.py" = ["D102", "D107", "FBT002", "PLR2004", "SLF001"]
"tests/test_lifecycle.py" = ["SLF001"]
